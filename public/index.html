<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4herus | Profil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tüm Sayfa ve Arka Plan Videosu Ayarları */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            user-select: none;
        }

        /* Arka plandaki video kutusu */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Videonun üzerindeki karartma perdesi */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Profil Kartı İçeriği */
        .profile-container {
            text-align: center;
            z-index: 1;
            animation: fadeIn 1.5s ease-in-out;
            padding: 20px;
        }

        /* Profil Resmi (Avatar) */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        /* Kullanıcı Adı */
        .username {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Açıklama Satırı */
        .bio {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 30px;
            font-style: italic;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Sosyal Medya İkon Alanı */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        /* İkonların Genel Stili */
        .icon-link {
            color: #ffffff;
            font-size: 26px;
            text-decoration: none;
            opacity: 0.75;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .icon-link:hover {
            opacity: 1;
            transform: translateY(-4px);
        }

        /* İkonların üzerine gelince parlayacağı renkler */
        .discord:hover { color: #5865F2; text-shadow: 0 0 15px #5865F2; }
        .instagram:hover { color: #E1306C; text-shadow: 0 0 15px #E1306C; }
        .steam:hover { color: #00adee; text-shadow: 0 0 15px #00adee; }

        /* Sol Alt Köşedeki Müzik Butonu */
        .music-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .music-player:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .music-btn {
            color: #fff;
            font-size: 16px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .music-text {
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Giriş Animasyonu */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay muted loop playsinline>
        <source src="/public/guren-lagann-edit.mp4" type="video/mp4">
    </video>

    <audio id="bg-music" loop>
        <source src="/public/music.mp3" type="audio/mpeg">
    </audio>

    <div class="overlay"></div>

    <div class="music-player" onclick="toggleMusic()">
        <button class="music-btn" id="play-icon">
            <i class="fas fa-play"></i>
        </button>
        <span class="music-text" id="music-status">PLAY</span>
    </div>

    <div class="profile-container">
        
        <img src="/public/avatar.jpg" alt="Avatar" class="avatar">

        <div class="username">4herus</div>

        <div class="bio">✦ "buraya kendi açıklamanı yazabilirsin" ✦</div>

        <div class="social-icons">
            <a href="https://discord.com" target="_blank" class="icon-link discord" title="Discord">
                <i class="fab fa-discord"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="icon-link instagram" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://steamcommunity.com" target="_blank" class="icon-link steam" title="Steam">
                <i class="fab fa-steam"></i>
            </a>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const playIcon = document.getElementById('play-icon');
        const musicStatus = document.getElementById('music-status');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                playIcon.innerHTML = '<i class="fas fa-pause"></i>';
                musicStatus.innerText = 'PAUSE';
            } else {
                music.pause();
                playIcon.innerHTML = '<i class="fas fa-play"></i>';
                musicStatus.innerText = 'PLAY';
            }
        }
    </script>

</body>
</html>
