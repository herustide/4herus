<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Profile | H E R U S</title>
    <!-- Tailwind CSS (Tasarım için) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dönen disk animasyonu */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 6s linear infinite;
        }
        /* Gizli tarayıcı elementleri ve genel sıfırlama */
        .select-none {
            user-select: none;
            -webkit-user-select: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-neutral-950 text-white font-sans select-none overflow-hidden min-h-screen flex flex-col items-center justify-center relative">

<!-- ARKA PLAN VİDEOSU -->
<video autoplay loop muted playsinline class="absolute top-0 left-0 w-full h-full object-cover z-0 brightness-[0.4] pointer-events-none">
    <source src="https://files.catbox.moe/lvnoe4.mp4" type="video/mp4">
</video>

    <!-- SES ELEMENTİ (Yolu public/ olarak güncellendi) -->
    <audio id="bg-audio" loop>
        <source src="public/music.mp3" type="audio/mpeg">
    </audio>

    <!-- MERKEZDEKİ BİLGİLER -->
    <div class="relative z-10 flex flex-col items-center text-center px-4 max-w-xl">
        <!-- PROFİL RESMİ (Yolu public/ olarak güncellendi) -->
        <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-white/20 shadow-[0_0_25px_rgba(255,255,255,0.1)] mb-4 bg-neutral-800 transition-transform duration-500 hover:scale-105">
            <img src="public/avatar.jpg" alt="" class="w-full h-full object-cover">
        </div>

        <!-- İSİM -->
        <h1 class="text-4xl font-extrabold tracking-wider mb-2 drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]">
            H E R U S
        </h1>

        <!-- SÖZ -->
        <p class="text-gray-300 text-sm md:text-base tracking-wide italic mb-6 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
            ✦ "Do the impossible, see the invisible" ✦
        </p>

        <!-- SOSYAL MEDYA İKONLARI BARINDIRICI -->
        <div class="flex items-center gap-4 scale-110 drop-shadow-[0_2px_10px_rgba(0,0,0,0.5)]">
            <div class="w-8 h-8 rounded-full border border-white/20 flex items-center justify-center bg-black/20 hover:bg-white/10 cursor-pointer transition-colors">
                ✦
            </div>
        </div>
    </div>

    <!-- SOL ALTTAKİ MODERN MÜZİK PLAYER -->
    <div class="absolute bottom-6 left-6 z-20 flex flex-col items-center gap-3 bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-xl">
        
        <!-- Dönen Disk / Buton (Disk resmi yolu public/ olarak güncellendi) -->
        <div id="disk-btn" class="relative w-16 h-16 rounded-full overflow-hidden border-2 border-white/20 shadow-lg cursor-pointer flex items-center justify-center group">
            <img src="public/avatar.jpg" alt="" class="absolute w-full h-full object-cover brightness-[0.5] group-hover:brightness-[0.3] transition-all">
            
            <!-- Play/Pause İkonları -->
            <div id="status-icon" class="relative z-10 text-white drop-shadow-md">
                <svg id="play-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-0.5"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                <svg id="pause-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
            </div>
            <div class="absolute w-3 h-3 bg-neutral-900 rounded-full border border-white/20"></div>
        </div>

        <span id="player-text" class="text-[10px] tracking-widest text-gray-400 font-bold uppercase">▸ PLAY</span>

        <!-- Ses Kontrolü -->
        <div class="flex items-center gap-2 px-1">
            <button id="mute-btn" class="text-gray-400 hover:text-white transition-colors">
                <svg id="vol-on" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <svg id="vol-mute" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
            </button>
            <input
                id="volume-slider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                class="w-16 h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white"
            />
        </div>
    </div>

    <!-- PLAYER LOGIC -->
    <script>
        const audio = document.getElementById('bg-audio');
        const diskBtn = document.getElementById('disk-btn');
        const playSvg = document.getElementById('play-svg');
        const pauseSvg = document.getElementById('pause-svg');
        const playerText = document.getElementById('player-text');
        const muteBtn = document.getElementById('mute-btn');
        const volOn = document.getElementById('vol-on');
        const volMute = document.getElementById('vol-mute');
        const volumeSlider = document.getElementById('volume-slider');

        let isPlaying = false;
        let preMuteVolume = 0.5;

        audio.volume = volumeSlider.value;

        diskBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                diskBtn.classList.remove('animate-spin-slow');
                playSvg.classList.remove('hidden');
                pauseSvg.classList.add('hidden');
                playerText.innerText = '▸ PLAY';
            } else {
                audio.play().catch(err => console.log("Müzik çalınamadı:", err));
                diskBtn.classList.add('animate-spin-slow');
                playSvg.classList.add('hidden');
                pauseSvg.classList.remove('hidden');
                playerText.innerText = '|| PAUSE';
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => {
            const currentVol = parseFloat(e.target.value);
            audio.volume = currentVol;
            
            if (currentVol === 0) {
                audio.muted = true;
                volOn.classList.add('hidden');
                volMute.classList.remove('hidden');
            } else {
                audio.muted = false;
                volOn.classList.remove('hidden');
                volMute.classList.add('hidden');
            }
        });

        muteBtn.addEventListener('click', () => {
            if (audio.muted || audio.volume === 0) {
                audio.muted = false;
                if(audio.volume === 0) audio.volume = preMuteVolume;
                volumeSlider.value = audio.volume;
                volOn.classList.remove('hidden');
                volMute.classList.add('hidden');
            } else {
                preMuteVolume = audio.volume;
                audio.muted = true;
                volumeSlider.value = 0;
                volOn.classList.add('hidden');
                volMute.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
