 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4herus | Profil</title>
    <!-- İkonlar için FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tüm Sayfa ve Arka Plan Videosu Ayarları */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Arka plandaki video kutusu */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2; /* En arkada kalması için */
        }

        /* Videonun üzerine karanlık katman (Yazıların okunması için) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65); /* Karartma derecesi (0.65) */
            z-index: -1;
        }

        /* Profil Kartı İçeriği */
        .profile-container {
            text-align: center;
            z-index: 1;
            animation: fadeIn 1.5s ease-in-out;
            padding: 20px;
        }

        /* Profil Resmi (Avatar) */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        /* Kullanıcı Adı */
        .username {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Açıklama Satırı */
        .bio {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 30px;
            font-style: italic;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Sosyal Medya İkon Alanı */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        /* İkonların Genel Stili */
        .icon-link {
            color: #ffffff;
            font-size: 26px;
            text-decoration: none;
            opacity: 0.75;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        /* Üzerine gelince büyüme ve renk geçişleri */
        .icon-link:hover {
            opacity: 1;
            transform: translateY(-4px);
        }

        /* İkonların üzerine gelince parlayacağı renkler */
        .discord:hover { color: #5865F2; text-shadow: 0 0 15px #5865F2; }
        .instagram:hover { color: #E1306C; text-shadow: 0 0 15px #E1306C; }
        .steam:hover { color: #00adee; text-shadow: 0 0 15px #00adee; }

        /* Giriş Animasyonu */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Arka Planda Dönecek Video -->
    <!-- otomatik oynat (autoplay), sessiz (muted) ve sürekli tekrar et (loop) ayarlı -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="guren-lagann-edit.mp4" type="video/mp4">
    </video>

    <!-- Videonun üzerindeki karartma perdesi -->
    <div class="overlay"></div>

    <!-- Profil Kartı -->
    <div class="profile-container">
        
        <!-- Profil Resmi (Şimdilik geçici bir anime resmi koydum, bunu da değiştirebiliriz) -->
        <img src="https://wallpapers.com/images/hd/anime-profile-picture-s97z6714g99497as.jpg" alt="Avatar" class="avatar">

        <!-- Düzenleyeceğin İsim Kısmı -->
        <div class="username">4herus</div>

        <!-- Düzenleyeceğin Açıklama Kısmı -->
        <div class="bio">✦ "buraya kendi açıklamanı yazabilirsin" ✦</div>

        <!-- Sosyal Medya Linklerin -->
        <div class="social-icons">
            <!-- Discord (href="link" kısmını değiştir) -->
            <a href="https://discord.com" target="_blank" class="icon-link discord" title="Discord">
                <i class="fab fa-discord"></i>
            </a>

            <!-- Instagram (href="link" kısmını değiştir) -->
            <a href="https://instagram.com" target="_blank" class="icon-link instagram" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>

            <!-- Steam (href="link" kısmını değiştir) -->
            <a href="https://steamcommunity.com" target="_blank" class="icon-link steam" title="Steam">
                <i class="fab fa-steam"></i>
            </a>
        </div>
    </div>

</body>
</html>
